<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy-based Cloaking</title>
    <script>
        function cloakURL() {
            const userInput = document.getElementById('urlInput').value;
            const proxyUrl = 'https://your-proxy-server.com/'; // Replace with your proxy server URL
            const cloakedUrl = proxyUrl + encodeURIComponent(userInput);
            document.getElementById('cloakedUrl').innerText = cloakedUrl;
        }
    </script>
</head>
<body>
    <h1>URL Cloaker</h1>
    <input type="text" id="urlInput" placeholder="Enter URL to cloak" />
    <button onclick="cloakURL()">Cloak URL</button>
    <p id="cloakedUrl"></p>
</body>
</html>
